<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQUAD ARCADE // 4P COMMAND</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #0b0614; color: #00f0ff; font-family: 'Share Tech Mono', monospace; min-height: 100vh; background-image: radial-gradient(circle at 50% 20%, rgba(122, 0, 255, 0.15) 0%, transparent 50%), linear-gradient(rgba(11, 6, 20, 0.9), rgba(11, 6, 20, 0.9)), url('https://media.giphy.com/media/26tn33aiTi1jkl6H6/giphy.gif'); background-size: cover; background-attachment: fixed; padding: 25px 15px 60px 15px; }
        
        #auth-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #07030d; display: flex; justify-content: center; align-items: center; z-index: 99999; }
        .auth-card { background: #140723; border: 3px solid #ff007f; padding: 35px 25px; border-radius: 10px; text-align: center; max-width: 420px; width: 90%; box-shadow: 0 0 40px rgba(255, 0, 127, 0.6); }
        .auth-input { width: 100%; background: #05020a; border: 2px solid #00f0ff; padding: 12px; color: #fff; font-family: 'Share Tech Mono', monospace; font-size: 1.1rem; margin-bottom: 18px; text-align: center; border-radius: 4px; }
        .auth-btn { background: #7a00ff; border: 2px solid #00f0ff; color: #fff; padding: 12px; width: 100%; font-family: 'Press Start 2P', cursive; cursor: pointer; border-radius: 4px; }

        .wrapper { max-width: 950px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 30px; border: 2px dashed #7a00ff; padding: 20px; background: rgba(10, 5, 20, 0.8); border-radius: 8px; }
        h1 { font-family: 'Press Start 2P', cursive; font-size: 1.5rem; color: #ff007f; text-shadow: 3px 3px #00f0ff; margin-bottom: 12px; }
        
        .section-header { font-family: 'Press Start 2P', cursive; font-size: 0.8rem; color: #ffe600; margin: 25px 0 12px 0; }
        .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        .arcade-input { flex: 1; background: #05020a; border: 2px solid #7a00ff; padding: 12px; color: #00f0ff; font-family: 'Share Tech Mono', monospace; border-radius: 4px; }
        .arcade-btn { background: #7a00ff; border: 2px solid #00f0ff; color: #fff; padding: 0 20px; font-family: 'Press Start 2P', cursive; cursor: pointer; border-radius: 4px; }
        
        .game-item { background: rgba(15, 8, 25, 0.9); border: 2px solid #444; padding: 14px 18px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .game-item.completed { border-color: #00ff66; background: rgba(0, 255, 102, 0.08); color: #00ff66; text-decoration: line-through; }
    </style>
</head>
<body>

    <div id="auth-overlay">
        <div class="auth-card">
            <h2>SQUAD KORUMA</h2>
            <input type="password" id="password-input" class="auth-input" placeholder="Parola...">
            <button class="auth-btn" onclick="checkPassword()">GİRİŞ YAP</button>
        </div>
    </div>

    <div class="wrapper">
        <header><h1>SQUAD ARCADE</h1></header>

        <div class="section-header">// OYUN HAVUZUNA EKLE</div>
        <div class="input-group">
            <input type="text" id="game-input" class="arcade-input" placeholder="Oyun adı...">
            <button class="arcade-btn" onclick="addGame()">EKLE</button>
        </div>

        <div class="section-header">// OYUN LİSTESİ</div>
        <div id="game-container"></div>
    </div>

    <script>
        const BIN_ID = "6a80df4af5f4af5e291b2807";
        const API_KEY = "$2a$10$1Dr4YKPthO6JReNxKNd7AO27j9X14Zzwlo5WPSt7R2O7w1XpLw4he";

        async function fetchData() {
            const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, { headers: { "X-Master-Key": API_KEY } });
            const json = await res.json();
            render(json.record);
        }

        async function updateData(newData) {
            await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                method: 'PUT',
                headers: { "Content-Type": "application/json", "X-Master-Key": API_KEY },
                body: JSON.stringify(newData)
            });
            fetchData();
        }

        function render(data) {
            const cont = document.getElementById("game-container");
            cont.innerHTML = data.games.map(g => `
                <div class="game-item ${g.done ? 'completed' : ''}">
                    <span>${g.name}</span>
                    <button class="arcade-btn" onclick="toggleDone(${g.id})">${g.done ? '✓' : 'TAMAMLA'}</button>
                </div>
            `).join('');
        }

        async function addGame() {
            const input = document.getElementById("game-input");
            if(!input.value) return;
            const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, { headers: { "X-Master-Key": API_KEY } });
            const json = await res.json();
            json.record.games.push({ id: Date.now(), name: input.value, done: false });
            updateData(json.record);
            input.value = "";
        }

        async function toggleDone(id) {
            const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, { headers: { "X-Master-Key": API_KEY } });
            const json = await res.json();
            json.record.games.forEach(g => { if(g.id === id) g.done = !g.done; });
            updateData(json.record);
        }

        function checkPassword() {
            if(document.getElementById("password-input").value === "o19yesmen") {
                document.getElementById("auth-overlay").style.display = "none";
                fetchData();
            } else alert("Yanlış parola!");
        }
    </script>
</body>
</html>
